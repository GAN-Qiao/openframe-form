<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPEN FRAME | JOIN US</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background:#000;
            color:#fff;
            font-family:sans-serif;
            background-image: radial-gradient(circle at center, #331111, #000 70%);
        }
        .curtain {
            position:absolute;
            left:0;top:0;width:100%;height:100%;
            background:linear-gradient(90deg, rgba(180,20,20,0.25), transparent 15%, transparent 85%, rgba(180,20,20,0.25));
            pointer-events:none;
        }
        .container {
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:40px 20px;
        }
        h1 {
            font-size:48px;
            font-weight:bold;
            color:#fff;
            margin-bottom:12px;
        }
        .subtitle {
            color:#ddd;
            margin-bottom:40px;
            text-align:center;
        }
        form {
            width:min(520px,100%);
        }
        input, textarea {
            width:100%;
            padding:14px 16px;
            margin-bottom:22px;
            background:#111;
            border:1px solid #444;
            color:#fff;
            border-radius:4px;
            font-size:16px;
        }
        input:focus, textarea:focus {
            outline:none;
            border-color:#b82020;
        }
        button {
            width:100%;
            padding:16px;
            background:#b82020;
            color:white;
            border:none;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:0.2s;
        }
        button:hover { background:#dd3030; }
        .back {
            margin-top:32px;
        }
        .back a {
            color:#888;
            text-decoration:none;
        }
    </style>
</head>
<body>
<div class="curtain"></div>
<div class="container">
    <h1>OPEN FRAME</h1>
    <div class="subtitle">Join our community of independent filmmakers</div>

    <form action="https://formspree.io/f/meagndwd" method="POST">
        <input type="text" name="fullname" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="affiliation" placeholder="Affiliation / Background">
        <input type="url" name="portfolio" placeholder="Portfolio Link">
        <textarea name="bio" rows="6" placeholder="Tell us about you & your filmmaking story" required></textarea>
        <button type="submit">SUBMIT</button>
    </form>

    <div class="back">
        <a href="javascript:history.back()">← Back</a>
    </div>
</div>
</body>
</html>
